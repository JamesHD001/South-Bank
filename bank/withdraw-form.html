<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdraw Funds</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="darkmode.css">

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
    body{min-height:100vh;background:#f5f7fa;color:#1a1a1a}
    .top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 25px;background:linear-gradient(90deg,#1e4d3a,#2fa37b);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12)}
    .right{display:flex;align-items:center;gap:12px}.top-bar a{color:#fff;text-decoration:none;font-weight:500;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:9px;transition:.2s}.top-bar a:hover{background:rgba(255,255,255,.25)}
    .theme-toggle{display:flex;align-items:center}.theme-toggle input{display:none}.toggle-slider{width:40px;height:20px;background:rgba(255,255,255,.35);border-radius:20px;position:relative;cursor:pointer}.toggle-slider:before{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .25s}.theme-toggle input:checked+.toggle-slider:before{transform:translateX(20px)}
    .page{width:min(900px,calc(100% - 30px));margin:42px auto;animation:fadeUp .5s ease}.page-header{margin-bottom:24px}.page-header h1{font-size:1.85rem;color:#1e4d3a}.page-header p{margin-top:6px;color:#6b7280}
    .action-card{background:#fff;border:1px solid #edf0f2;border-radius:18px;padding:34px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .form-section{margin-bottom:28px;padding-bottom:26px;border-bottom:1px solid #edf0f2}.form-section:last-of-type{margin-bottom:0;padding-bottom:0;border-bottom:0}.form-section h3{color:#2fa37b;font-size:1rem;margin-bottom:16px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    label{display:block;font-size:.84rem;font-weight:600;margin-bottom:7px;color:#374151}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;font-size:.94rem;background:#fff;color:#1f2937;transition:.2s}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{outline:none;border-color:#2fa37b;box-shadow:0 0 0 3px rgba(47,163,123,.12)}
    .status-message{display:none;margin-bottom:25px;padding:14px 16px;border-radius:12px;line-height:1.5;font-size:.9rem}.status-message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.status-message.success{display:block;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
    .form-action{border-top:1px solid #edf0f2;padding-top:25px;text-align:center}.form-action button{border:0;border-radius:12px;padding:14px 38px;background:#2fa37b;color:#fff;font-size:.98rem;font-weight:600;cursor:pointer;box-shadow:0 6px 15px rgba(47,163,123,.18);transition:.2s}.form-action button:hover{background:#1e4d3a;transform:translateY(-2px)}.form-action button:disabled{opacity:.6;cursor:not-allowed;transform:none}.hint{margin-top:10px;font-size:.8rem;color:#777}.back-link{display:block;margin-top:22px;color:#2fa37b;text-decoration:none;font-weight:500}.back-link:hover{text-decoration:underline}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){.top-bar{padding:12px 16px}.right{gap:7px}.top-bar strong{font-size:.88rem}.top-bar a{padding:7px 9px;font-size:.78rem}.page{width:min(100% - 20px,900px);margin:28px auto}.page-header h1{font-size:1.5rem}.action-card{padding:24px 18px;border-radius:16px}.grid-2{grid-template-columns:1fr;gap:16px}.form-action button{width:100%}}
  </style>
</head>
<body>
  <header class="top-bar">
    <strong>South International Bank</strong>
    <div class="right">
      <label class="theme-toggle" aria-label="Toggle dark mode"><input type="checkbox" id="themeSwitch"><span class="toggle-slider"></span></label>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout();return false;">Logout</a>
    </div>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Withdraw Funds</h1>
      <p>Submit a withdrawal request from your account.</p>
    </section>

    <section class="action-card">
      <div id="statusMessage" class="status-message" role="alert" aria-live="polite"></div>

      <div class="form-section">
        <h3>Account Information</h3>
        <div class="grid-2">
          <div><label for="account-holder">Account Holder Name</label><input type="text" id="account-holder" placeholder="Emily Carter" required></div>
          <div><label for="bank">Bank Name</label><input type="text" id="bank" placeholder="e.g. Wells Fargo" required></div>
        </div>
      </div>

      <div class="form-section">
        <h3>Withdrawal Details</h3>
        <div class="grid-2">
          <div><label for="account-number">Account Number</label><input type="text" id="account-number" placeholder="1234567890" required></div>
          <div><label for="amount">Amount (USD)</label><input type="number" id="amount" placeholder="2000" required></div>
        </div>
      </div>

      <div class="form-section">
        <h3>Additional Information</h3>
        <label for="reason">Withdrawal Reason / Note (optional)</label>
        <textarea id="reason" placeholder="Optional reason or note for withdrawal..."></textarea>
      </div>

      <div class="form-action">
        <button id="submitWithdrawal" type="button">Continue</button>
        <p class="hint">You’ll review the withdrawal before final submission.</p>
      </div>
    </section>

    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
  </main>

  <script src="darkmode.js"></script>
  <script>
    const LOCK_MESSAGE = "Withdrawals are locked for your account. Kindly visit the bank with your credentials to unfreeze your account!";
    const submitButton = document.getElementById("submitWithdrawal");
    const statusMessage = document.getElementById("statusMessage");

    function logout(){sessionStorage.removeItem("loggedIn");window.location.href="auth/login.html";}

    function showStatus(message,type){
      statusMessage.textContent=message;
      statusMessage.className=`status-message ${type}`;
    }

    async function loadWithdrawalStatus(){
      const response=await fetch("/api/account/withdrawal-status",{credentials:"same-origin"});
      if(response.status===401){window.location.href="auth/login.html";return false;}
      if(!response.ok)throw new Error("Unable to load account status.");
      const {withdrawalLocked}=await response.json();
      if(withdrawalLocked){submitButton.disabled=true;showStatus(LOCK_MESSAGE,"error");}
      return !withdrawalLocked;
    }

    submitButton.addEventListener("click",async()=>{
      submitButton.disabled=true;
      statusMessage.className="status-message";
      try{
        const canWithdraw=await loadWithdrawalStatus();
        if(!canWithdraw)return;
        const accountHolder=document.getElementById("account-holder").value.trim();
        const bank=document.getElementById("bank").value.trim();
        const accountNumber=document.getElementById("account-number").value.trim();
        const amount=document.getElementById("amount").value.trim();
        const reason=document.getElementById("reason").value.trim();
        if(!accountHolder||!bank||!accountNumber||!amount){showStatus("Please fill all required fields.","error");return;}
        const response=await fetch("/api/withdrawals",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({accountHolder,bank,accountNumber,amount,reason})});
        const result=await response.json();
        if(!response.ok){showStatus(result.error||"Withdrawal could not be submitted.","error");return;}
        showStatus(result.message||"Withdrawal request submitted successfully.","success");
        document.getElementById("account-holder").value="";
        document.getElementById("bank").value="";
        document.getElementById("account-number").value="";
        document.getElementById("amount").value="";
        document.getElementById("reason").value="";
      }catch(error){showStatus("Unable to submit withdrawal. Please try again.","error");}
      finally{
        if(statusMessage.textContent!==LOCK_MESSAGE)submitButton.disabled=false;
      }
    });

    loadWithdrawalStatus().catch(()=>showStatus("Unable to load account status. Please try again.","error"));
  </script>
</body>
</html>
