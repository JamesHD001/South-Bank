<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Withdraw Funds Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef3f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    h2 {
      text-align: center;
      color: #0077b6;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    textarea {
      resize: vertical;
    }
    button {
      background-color: #0077b6;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #023e8a;
    }
    button:disabled {
      background-color: #9aa7b2;
      cursor: not-allowed;
    }
    .status-message {
      display: none;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      line-height: 1.4;
    }
    .status-message.error { display: block; background: #fee2e2; color: #991b1b; }
    .status-message.success { display: block; background: #dcfce7; color: #166534; }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #0077b6;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Withdraw Funds</h2>
    <div id="statusMessage" class="status-message" role="alert" aria-live="polite"></div>
    <form id="withdrawalForm">
      <label for="account-holder">Account Holder Name</label>
      <input type="text" id="account-holder" name="account-holder" placeholder="e.g. Emily Carter" required />

      <label for="bank">Bank Name</label>
      <input type="text" id="bank" name="bank" placeholder="e.g. Wells Fargo" required />

      <label for="account-number">Account Number</label>
      <input type="text" id="account-number" name="account-number" placeholder="e.g. 1234567890" required />

      <label for="amount">Amount (USD)</label>
      <input type="number" id="amount" name="amount" placeholder="e.g. 2000" required />

      <label for="reason">Withdrawal Reason / Note (optional)</label>
      <textarea id="reason" name="reason" rows="3" placeholder="Optional reason or note for withdrawal..."></textarea>

      <button id="submitWithdrawal" type="submit">Submit Withdrawal</button>
    </form>
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
  </div>
  <script>
    const LOCK_MESSAGE = "Withdrawals are locked for your account. Kindly visit the bank with your credentials to unfreeze your account!";
    const form = document.getElementById("withdrawalForm");
    const submitButton = document.getElementById("submitWithdrawal");
    const statusMessage = document.getElementById("statusMessage");

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
    }

    async function loadWithdrawalStatus() {
      const response = await fetch("/api/account/withdrawal-status", { credentials: "same-origin" });
      if (response.status === 401) {
        window.location.href = "auth/login.html";
        return false;
      }
      if (!response.ok) throw new Error("Unable to load account status.");
      const { withdrawalLocked } = await response.json();
      if (withdrawalLocked) {
        submitButton.disabled = true;
        showStatus(LOCK_MESSAGE, "error");
      }
      return !withdrawalLocked;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      statusMessage.className = "status-message";
      try {
        const canWithdraw = await loadWithdrawalStatus();
        if (!canWithdraw) return;
        const payload = Object.fromEntries(new FormData(form));
        const response = await fetch("/api/withdrawals", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            accountHolder: payload["account-holder"],
            bank: payload.bank,
            accountNumber: payload["account-number"],
            amount: payload.amount,
            reason: payload.reason
          })
        });
        const result = await response.json();
        if (!response.ok) {
          showStatus(result.error || "Withdrawal could not be submitted.", "error");
          return;
        }
        showStatus(result.message, "success");
        form.reset();
      } catch {
        showStatus("Unable to submit withdrawal. Please try again.", "error");
      } finally {
        if (!statusMessage.classList.contains("error") || statusMessage.textContent !== LOCK_MESSAGE) {
          submitButton.disabled = false;
        }
      }
    });

    loadWithdrawalStatus().catch(() => showStatus("Unable to load account status. Please try again.", "error"));
  </script>
</body>
</html>
