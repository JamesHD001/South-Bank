<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>South Online Banking | Login</title>
<link rel="stylesheet" href="../bank-brand.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef6f2,#f5f7fa);color:#17231d}.login-container{width:min(420px,100%);background:#fff;border:1px solid #e5ebe8;border-radius:22px;padding:34px;box-shadow:0 18px 50px #153d2a18}.brand{text-align:center;margin-bottom:26px}.brand h1{font-size:1.45rem;color:#1e4d3a;margin:10px 0 4px}.brand p{margin:0;color:#6b7280;font-size:.88rem}label{display:block;font-size:.84rem;font-weight:600;margin:0 0 7px;color:#374151}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:11px;font-size:.95rem;margin-bottom:17px}input:focus{outline:0;border-color:#2fa37b;box-shadow:0 0 0 3px #2fa37b1f}button{width:100%;padding:13px;border:0;border-radius:11px;background:#2fa37b;color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}button:hover{background:#1e4d3a}.error-message{display:none;margin-bottom:15px;padding:11px 12px;border-radius:10px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;text-align:center;font-size:.85rem}.back-home{margin-top:15px;text-align:center}.back-home a{color:#2fa37b;text-decoration:none;font-size:.88rem}.demo-note{margin-top:18px;text-align:center;font-size:.74rem;color:#8a938e;line-height:1.5}
</style>
</head>
<body>
<div class="login-container">
<a class="bank-logo" href="../dashboard.html" aria-label="South International Bank dashboard">
  <span class="bank-logo-mark" aria-hidden="true"><span>SB</span></span>
  <span class="bank-logo-copy"><span class="bank-logo-name">South International Bank</span><span class="bank-logo-tagline">Secure. Simple. Truly South Bank.</span></span>
</a>
<div class="brand"><h1>Sign in to Online Banking</h1><p>Secure Online Banking</p></div>
<div class="error-message" id="error" role="alert"></div>
<form id="loginForm" autocomplete="off"><label for="username">Username</label><input id="username" type="text" placeholder="Enter username" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" placeholder="Enter password" required autocomplete="current-password"><button type="submit" id="loginBtn">Sign In</button></form>
<div class="back-home"><a href="../index.html">← Back Home</a></div>
<p class="demo-note">Authentication is server-backed for this deployment.</p>
</div>
<footer class="bank-footer">
  <div>&copy; 2025 South International Bank. All rights reserved.</div>
  <nav class="bank-footer-links" aria-label="Legal links"><a href="../privacy.html">Privacy Policy</a><a href="../terms.html">Terms of Use</a></nav>
</footer>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error'),btn=document.getElementById('loginBtn');error.style.display='none';btn.disabled=true;btn.textContent='Signing in...';const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Invalid');const accountResponse=await fetch('/data/accounts.json');const accounts=await accountResponse.json();const account=accounts[username];sessionStorage.setItem('loggedIn','true');sessionStorage.setItem('username',username);sessionStorage.setItem('withdrawalLocked',String(account?.withdrawalLocked===true));location.href='../dashboard.html'}catch(err){error.textContent=err.message==='Invalid Username or Password'?'Invalid Username or Password':'Unable to sign in. Please try again.';error.style.display='block'}finally{btn.disabled=false;btn.textContent='Sign In'}});
</script>
</body>
</html>
