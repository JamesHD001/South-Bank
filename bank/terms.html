<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms of Use | South International Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="darkmode.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
      color: #1a1a1a;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 12px 25px;
      background: linear-gradient(90deg, #1e4d3a, #2fa37b);
      color: white;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }

    .top-bar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      background: #0bec9ea4;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .page {
      width: min(90%, 700px);
      margin: auto;
      padding: 55px 20px;
      text-align: center;
    }

    .error-card {
      padding: 42px 32px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .error-code {
      margin: 0;
      color: #2fa37b;
      font-size: 4rem;
      line-height: 1;
    }

    h1 {
      margin: 20px 0 12px;
      color: #1e4d3a;
    }

    p {
      color: #555;
      line-height: 1.65;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #2fa37b;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s, transform .2s;
    }

    .back-link:hover {
      background: #1e4d3a;
      transform: translateY(-2px);
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #002d72;
      color: white;
      font-size: .85em;
    }

    footer a {
      color: white;
    }

    body.dark {
      background: #121212;
      color: #e0e0e0;
    }

    body.dark .error-card {
      background: #1e1e1e;
      border: 1px solid #444;
    }

    body.dark h1 {
      color: #4cd9a0;
    }

    body.dark p {
      color: #c7c7c7;
    }

    body.dark footer {
      background: #1e1e1e;
    }

    @media (max-width: 600px) {
      .top-bar {
        padding: 12px 16px;
      }

      .error-card {
        padding: 34px 22px;
      }

      .error-code {
        font-size: 3.25rem;
      }
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <strong>South International Bank</strong>
    <a href="dashboard.html">Dashboard</a>
  </header>
  <main class="page">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">503</p>
      <h1 id="error-title">Page currently unavailable</h1>
      <p>Our Terms of Use are being prepared and are not available yet. Please check back when this page has been
        updated.</p>
      <a class="back-link" href="dashboard.html">Return to Dashboard</a>
    </section>
  </main>
  <footer>&copy; 2025 South International Bank. All rights reserved.</footer>
  <script src="darkmode.js"></script>
</body>

</html>
