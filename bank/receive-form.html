<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receive Funds</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="darkmode.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      background: #f5f7fa;
      color: #1a1a1a;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 25px;
      background: linear-gradient(90deg, #1e4d3a, #2fa37b);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .brand { font-weight: 700; }

    .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      background: rgba(255,255,255,0.14);
      padding: 8px 14px;
      border-radius: 9px;
      transition: 0.2s ease;
    }

    .top-bar a:hover { background: rgba(255,255,255,0.25); }

    .theme-toggle { display: flex; align-items: center; }
    .theme-toggle input { display: none; }
    .toggle-slider {
      width: 40px;
      height: 20px;
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s ease;
    }
    .theme-toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    .page {
      width: min(900px, calc(100% - 30px));
      margin: 42px auto;
      animation: fadeUp 0.5s ease;
    }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 1.85rem; color: #1e4d3a; }
    .page-header p { margin-top: 6px; color: #6b7280; }

    .receive-card {
      background: #fff;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #edf0f2;
    }

    .form-section {
      margin-bottom: 28px;
      padding-bottom: 26px;
      border-bottom: 1px solid #edf0f2;
    }

    .form-section:last-of-type { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }

    .form-section h3 {
      color: #2fa37b;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .field { min-width: 0; }

    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 7px;
      color: #374151;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.94rem;
      color: #1f2937;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea { min-height: 100px; resize: vertical; }

    input:focus, textarea:focus {
      outline: none;
      border-color: #2fa37b;
      box-shadow: 0 0 0 3px rgba(47,163,123,0.12);
    }

    .form-action {
      border-top: 1px solid #edf0f2;
      padding-top: 25px;
      text-align: center;
    }

    .form-action button {
      border: 0;
      border-radius: 12px;
      padding: 14px 38px;
      background: #2fa37b;
      color: #fff;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(47,163,123,0.18);
      transition: 0.2s ease;
    }

    .form-action button:hover {
      background: #1e4d3a;
      transform: translateY(-2px);
    }

    .hint { margin-top: 10px; font-size: 0.8rem; color: #777; }

    .back-link {
      display: block;
      margin-top: 22px;
      color: #2fa37b;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover { text-decoration: underline; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .top-bar { padding: 12px 16px; }
      .brand { font-size: 0.88rem; }
      .right { gap: 7px; }
      .top-bar a { padding: 7px 9px; font-size: 0.78rem; }
      .page { width: min(100% - 20px, 900px); margin: 28px auto; }
      .page-header h1 { font-size: 1.5rem; }
      .receive-card { padding: 24px 18px; border-radius: 16px; }
      .grid-2 { grid-template-columns: 1fr; gap: 16px; }
      .form-section { margin-bottom: 23px; padding-bottom: 22px; }
      .form-action button { width: 100%; }
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <strong class="brand">South International Bank</strong>

    <div class="right">
      <label class="theme-toggle" aria-label="Toggle dark mode">
        <input type="checkbox" id="themeSwitch">
        <span class="toggle-slider"></span>
      </label>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </div>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Receive Funds</h1>
      <p>Provide sender and recipient details to receive money securely.</p>
    </section>

    <section class="receive-card">
      <div class="form-section">
        <h3>Sender Information</h3>
        <div class="field">
          <label for="sender">Sender Name</label>
          <input type="text" id="sender" placeholder="Charles Reeves" required>
        </div>
      </div>

      <div class="form-section">
        <h3>Recipient Details</h3>
        <div class="grid-2">
          <div class="field">
            <label for="recipient">Recipient Name</label>
            <input type="text" id="recipient" placeholder="Emily Carter" required>
          </div>
          <div class="field">
            <label for="bank">Recipient Bank</label>
            <input type="text" id="bank" placeholder="e.g. South Bank" required>
          </div>
          <div class="field">
            <label for="account">Account Number</label>
            <input type="text" id="account" placeholder="1234567890" required>
          </div>
          <div class="field">
            <label for="routing">Routing Number</label>
            <input type="text" id="routing" placeholder="101000187" required>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Transaction Details</h3>
        <div class="grid-2">
          <div class="field">
            <label for="amount">Amount (USD)</label>
            <input type="number" id="amount" placeholder="15000" required>
          </div>
          <div class="field">
            <label for="note">Description (optional)</label>
            <input type="text" id="note" placeholder="Optional note">
          </div>
        </div>
      </div>

      <div class="form-action">
        <button type="button" id="receiveBtn">Submit Request</button>
        <p class="hint">Funds will be credited after sender confirmation.</p>
      </div>
    </section>

    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
  </main>

  <script src="darkmode.js"></script>
  <script>
    function logout() {
      sessionStorage.removeItem("loggedIn");
      window.location.href = "auth/login.html";
    }

    document.getElementById("receiveBtn").addEventListener("click", () => {
      const requiredFields = ["sender", "recipient", "bank", "account", "routing", "amount"];
      const isComplete = requiredFields.every(id => document.getElementById(id).value.trim());

      if (!isComplete) {
        alert("Please fill all required fields.");
        return;
      }

      alert("Receive request submitted successfully (simulation).");
    });
  </script>
</body>
</html>
