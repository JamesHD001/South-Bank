<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Receive Funds</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Dark mode only -->
  <link rel="stylesheet" href="darkmode.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #1f2937;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 25px;
      background: linear-gradient(90deg, #1e4d3a, #2fa37b);
      color: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    .top-bar .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      background: rgba(255,255,255,0.15);
      padding: 8px 14px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .top-bar a:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Page */
    .page {
      max-width: 920px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 26px;
    }

    .page-header p {
      margin-top: 6px;
      color: #6b7280;
    }

    /* Card */
    .receive-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .form-section {
      margin-bottom: 28px;
    }

    .form-section h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
    }

    .form-action {
      text-align: center;
      margin-top: 30px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #6b7280;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      text-decoration: none;
      color: #2563eb;
      font-weight: 500;
    }

    /* Dark mode overrides */
    body.dark {
      background: #0f172a;
      color: #e5e7eb;
    }

    body.dark .top-bar,
    body.dark .receive-card {
      background: #020617;
      border-color: #1e293b;
    }

    body.dark input,
    body.dark textarea {
      background: #020617;
      border-color: #1e293b;
      color: #e5e7eb;
    }

    body.dark .page-header p,
    body.dark .hint {
      color: #94a3b8;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
    }
    .theme-toggle input {
      display: none;
    }
    .toggle-slider {
      width: 40px;
      height: 20px;
      background: #ccc;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .theme-toggle input:checked + .toggle-slider {
      background: #ffffff;
    }
    .theme-toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

  </style>
</head>

<body>

<header class="top-bar">
  <strong>South International Bank</strong>

  <div class="right">
    <!-- Theme Toggle -->
    <label class="theme-toggle">
      <input type="checkbox" id="themeSwitch">
      <span class="toggle-slider"></span>
    </label>

    <a href="settings.html">Settings</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</header>

<main class="page">

  <section class="page-header">
    <h1>Receive Funds</h1>
    <p>Provide sender details to receive money securely</p>
  </section>

  <section class="receive-card">

    <!-- Sender Info -->
    <div class="form-section">
      <h3>Sender Information</h3>
      <label>Sender Name</label>
      <input type="text" placeholder="Charles Reeves" required>
    </div>

    <!-- Recipient Info -->
    <div class="form-section">
      <h3>Recipient Details</h3>
      <div class="grid-2">
        <div>
          <label>Recipient Name</label>
          <input type="text" placeholder="Emily Carter" required>
        </div>
        <div>
          <label>Recipient Bank</label>
          <input type="text" placeholder="e.g South Bank" required>
        </div>
      </div>
    </div>

    <!-- Bank Details -->
    <div class="form-section">
      <div class="grid-2">
        <div>
          <label>Account Number</label>
          <input type="text" placeholder="1234567890" required>
        </div>
        <div>
          <label>Routing Number</label>
          <input type="text" placeholder="101000187" required>
        </div>
      </div>
    </div>

    <!-- Amount -->
    <div class="form-section">
      <div class="grid-2">
        <div>
          <label>Amount (USD)</label>
          <input type="number" placeholder="15000" required>
        </div>
        <div>
          <label>Description (optional)</label>
          <input type="text" placeholder="Optional note">
        </div>
      </div>
    </div>

    <!-- Action -->
    <div class="form-action">
      <button>Submit Request</button>
      <p class="hint">Funds will be credited after sender confirmation</p>
    </div>

  </section>

  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

</main>

<script src="darkmode.js"></script>

</body>
</html>
